# Production. Every push to master ships.
#
# This replaced a version tag gate, and the trade is worth writing down. The gate
# bought control over the MOMENT of shipping, not safety: verify runs on this path and
# on every pull request either way, so the quality bar never depended on it. What it
# cost was an extra step per release and drift, master carrying merged commits that
# were not live.
#
# THE ONE THING THE GATE WAS ACTUALLY LOAD BEARING FOR IS MIGRATIONS, and that ordering
# is now yours to keep by hand: run db-migrate BEFORE merging a change that depends on
# a new column, never after. A merge is a deploy now, so there is no window between the
# two in which to catch up.
#
# THIS ASSUMES VERCEL'S OWN GIT INTEGRATION IS OFF. If the project is connected to
# GitHub in the dashboard, Vercel deploys on every push as well and you get two
# deployments racing for the same alias. vercel.json in the repo root turns it off.

name: Deploy to production

on:
  push:
    branches: [master]

concurrency:
  group: production
  # Never cancel a deploy that is already talking to Vercel. Pushes queue instead, and
  # the later one wins by finishing last.
  cancel-in-progress: false

jobs:
  # The same lint, tests and build a pull request gets. A red master does not deploy.
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      # Records the deployment against the repo and puts the live URL on the run.
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # `vercel build` runs its own install using the manager it detects from
      # pnpm-lock.yaml, and off Vercel's own build image that means resolving pnpm from
      # PATH. The runner does not ship one, so without this the build step fails.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"   # keep in step with Vercel Project Settings, Node.js Version

      - run: npm install --global vercel@latest

      # Fetches the project's production environment into .vercel/, which is what the
      # build below reads. The Spotify tokens and the Neon string live in the Vercel
      # project, never in GitHub, and this is the step that collects them.
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - run: vercel build --prod --token="$VERCEL_TOKEN"

      # --prebuilt uploads what was just built rather than asking Vercel to build it
      # again, so what ships is exactly what this workflow produced.
      #
      # `shell: bash` rather than the default, and it is load bearing: an unqualified
      # `run` gets `bash -e`, which in a pipeline only sees the exit status of `tail`.
      # A rejected deploy would exit non-zero, print nothing, and still pass, leaving a
      # green run that says it shipped a blank URL. Naming the shell adds pipefail.
      - id: deploy
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Shipped \`${GITHUB_SHA:0:7}\` to $url" >> "$GITHUB_STEP_SUMMARY"
